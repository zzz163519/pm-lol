[project]
name = "pm-lol"
version = "0.1.0"
description = "Polymarket LoL data foundation spike"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
]

[project.optional-dependencies]
source-spike = [
  "streamlink>=8.4,<9",
]
vision-spike = [
  "numpy>=2,<2.3",
  "rapidocr-onnxruntime>=1.4,<2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
